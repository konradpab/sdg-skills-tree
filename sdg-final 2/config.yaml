# config.yaml — single source of truth for the thesis pipeline

project:
  name: "sdg-skill-trees"
  version: "1.1.0"

scope:
  geographic_unit: "country-year"
  country_key: "country_iso3"
  time_key: "year"
  train_start: 1996
  train_end: 2023
  forecast_horizons: [1, 3, 5]
  case_study_countries: ["POL", "DEU", "IND"]

data_sources:
  unsd_sdg:       true
  ember:          true
  primap:         true
  wgi:            true
  vdem:           false
  wdi:            true
  swiid:          true
  carbon_pricing: true
  ucdp:           true
  unesco:         false
  wvs:            false
  gdelt:          false
  oec:            false
  wid:            false

endpoints:
  unsd_sdg:
    base_url: "https://unstats.un.org/sdgapi/v1/sdg"
    series:
      elec_access:    "EG_ELC_ACCS"
      renewables:     "EG_FEC_RNEW"
      energy_int:     "EG_EGY_PRIM"
      manuf_va:       "NV_IND_MANF"
      rd_expend:      "GB_XPD_RSDV"
      co2_pc:         "EN_ATM_CO2E_PC"
    page_size: 1000

  ember:
    yearly_url: "https://ember-energy.org/app/uploads/2024/09/yearly_full_release_long_format.csv"
    local_file: "ember/yearly_full_release_long_format.csv"

  primap:
    zenodo_record: "15016289"
    download_url: "https://zenodo.org/records/15016289/files/Guetschow-et-al-2025-PRIMAP-hist_v2.6.1_no_extrap_25-Feb-2025.csv"
    local_file: "primap/primap_hist.csv"

  wgi:
    api_url: "https://api.worldbank.org/v2/country/all/indicator/{indicator}?date=1996:2023&format=json&per_page=20000"
    indicators:
      gov_effectiveness:   "GE.EST"
      regulatory_quality:  "RQ.EST"
      rule_of_law:         "RL.EST"
      control_corruption:  "CC.EST"
      political_stability: "PV.EST"
      voice_accountability: "VA.EST"

  vdem:
    download_page: "https://v-dem.net/data/the-v-dem-dataset/"
    variables:
      - "v2x_polyarchy"
      - "v2x_libdem"
      - "v2x_partipdem"

  wdi:
    api_url: "https://api.worldbank.org/v2/country/all/indicator/{indicator}?date=1996:2023&format=json&per_page=20000"
    indicators:
      gdp_pc_ppp:          "NY.GDP.PCAP.PP.KD"
      gdp_growth:          "NY.GDP.MKTP.KD.ZG"
      industry_gdp_pct:    "NV.IND.TOTL.ZS"
      energy_use_pc:       "EG.USE.PCAP.KG.OE"
      edu_expenditure:     "SE.XPD.TOTL.GD.ZS"
      population:          "SP.POP.TOTL"
      urban_pct:           "SP.URB.TOTL.IN.ZS"

  swiid:
    download_url: "https://fsolt.org/swiid/swiid9_6.zip"

  carbon_pricing:
    download_url: "https://carbonpricingdashboard.worldbank.org/sites/default/files/data-latest.xlsx"

  ucdp:
    ged_url: "https://ucdp.uu.se/downloads/ged/ged241-csv.zip"

  unesco:
    api_url: "http://api.uis.unesco.org/sdmx/data/{dataset}"
    datasets:
      edu_spending: "EDU_FINANCE"
      rd_spending: "RD"

  wvs:
    download_page: "https://www.worldvaluessurvey.org/WVSDocumentationWV7.jsp"

  gdelt:
    api_url: "https://api.gdeltproject.org/api/v2/doc/doc"
    events_url: "http://data.gdeltproject.org/events/"

  oec:
    api_url: "https://oec.world/api/"

  wid:
    data_url: "https://wid.world/bulk-download/"
    csv_url: "https://wid.world/data/"

model:
  train_cutoff: 2017
  val_cutoff: 2020
  targets:
    - "renewables_share_pct"
    - "co2_per_capita_t"
    - "energy_intensity_mj_usd"
    - "electricity_access_pct"
    - "gini_disposable"
  gradient_boosting:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
  quantile_regression:
    quantiles: [0.10, 0.25, 0.50, 0.75, 0.90]
  conformal:
    alpha: 0.10

planner:
  weights:
    w_sdg:         0.25
    w_co2:         0.30
    w_equity:      0.10
    w_feasibility: 0.15
    w_speed:       0.10
    w_cost:        0.10

paths:
  data_raw:        "data_raw"
  data_interim:    "data_interim"
  data_processed:  "data_processed"
  models:          "models_saved"
  outputs:         "outputs/recommendations"
  figures:         "reports/figures"
  report:          "reports/final_report.html"
  registry:        "registry"
