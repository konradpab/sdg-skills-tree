name: CI — Synthetic Pipeline Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-synthetic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ run_pipeline.py --exit-zero

      - name: Run tests (synthetic data)
        run: pytest tests/ -v --tb=short

      - name: Run full pipeline (synthetic mode)
        run: python run_pipeline.py --synthetic

      - name: Verify outputs exist
        run: |
          test -f reports/final_report.html
          test -f data_processed/master_panel.csv
          test -f outputs/recommendations/POL_roadmap.csv
          test -f outputs/recommendations/DEU_roadmap.csv
          test -f outputs/recommendations/IND_roadmap.csv
          test -f models_saved/training_results.json
          echo "All output artifacts verified."

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-py${{ matrix.python-version }}
          path: reports/final_report.html

  # Separate job to test real data (runs weekly, not on every push)
  test-real-data:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[test-real]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Pre-flight check
        run: python preflight.py --env-only || true
      - name: Run pipeline on real data
        run: python run_pipeline.py --real
        timeout-minutes: 20
      - name: Upload real-data report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-real-data
          path: |
            reports/final_report.html
            data_interim/coverage_report.json
            pipeline.log
