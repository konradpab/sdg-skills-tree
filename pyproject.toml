[project]
name = "sdg-skills-tree"
version = "1.0.0"
description = "ML pipeline for country-specific SDG intervention roadmaps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Konrad" },
]

dependencies = [
    # Core data stack
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",           # parquet support
    "openpyxl>=3.1",           # Excel reading (Carbon Pricing, WGI)

    # ML
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "shap>=0.43",              # interpretability

    # Visualization
    "matplotlib>=3.7",
    "seaborn>=0.12",

    # Statistics
    "scipy>=1.11",

    # Graph / DAG
    "networkx>=3.1",

    # Config + templating
    "pyyaml>=6.0",
    "jinja2>=3.1",

    # HTTP / ingestion
    "requests>=2.31",

    # Hashing / provenance (stdlib, but listed for clarity)
]

[project.optional-dependencies]
# Install with: pip install -e ".[quarto]"
quarto = [
    "jupyter>=1.0",            # needed for Quarto rendering
    "nbformat>=5.9",
]
# Install with: pip install -e ".[dev]"
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "pre-commit>=3.5",
]
# Install with: pip install -e ".[extensions]"
extensions = [
    "geopandas>=0.14",         # NUTS2 maps
    "mapclassify>=2.6",
    "plotly>=5.17",            # interactive viz
    "causal-learn>=0.1",       # causal forest ablation
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
